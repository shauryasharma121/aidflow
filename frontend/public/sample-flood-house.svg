  <!-- Back Pole / Structure -->
  <rect x="635" y="160" width="14" height="150" fill="#4d5357"/>
  
  <!-- Right shed / garage submerged -->
  <rect x="475" y="240" width="145" height="120" fill="#4f3e35"/>
  <rect x="515" y="260" width="40" height="45" fill="#24313b"/>

  <!-- Main House Roof & Body -->
