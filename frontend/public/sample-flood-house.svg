  <rect x="330" y="270" width="42" height="75" rx="3" fill="#202c36"/>

  <!-- Water layers (submerged first floor) -->
  <path d="M 0 310 Q 200 300 400 325 T 800 315 L 800 450 L 0 450 Z" fill="#847c5d"/>
  <path d="M 0 335 Q 240 320 480 345 T 800 330 L 800 450 L 0 450 Z" fill="#756c4d"/>
